<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%230a0a0a%22/><text x=%2216%22 y=%2222%22 font-family=%22Helvetica%22 font-size=%2213%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22>FK</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FKB2B — Accès professionnel</title>
<style>
  :root {
    --noir: #0a0a0a; --noir2: #141414; --noir3: #1d1d1d; --bord: #2a2a2a;
    --blanc: #f5f5f5; --gris: #9a9a9a;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--noir); color: var(--blanc); font-family: "Helvetica Neue", Arial, sans-serif;
    min-height: 100svh; display: grid; place-items: center; -webkit-font-smoothing: antialiased; overflow: hidden; }

  .fond { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(60% 50% at 50% 0%, #1a1a1a 0%, transparent 70%); }
  .fond::after { content: "FK"; position: absolute; right: -4vw; bottom: -14vh; font-size: 46vh; font-weight: 800;
    color: #101010; letter-spacing: -.05em; user-select: none; }

  .carte { position: relative; width: min(400px, calc(100vw - 40px)); padding: 46px 40px 38px;
    background: var(--noir2); border: 1px solid var(--bord); border-radius: 20px;
    opacity: 1; transform: translateY(0);
    transition: opacity 500ms var(--ease-out), transform 500ms var(--ease-out);
    @starting-style { opacity: 0; transform: translateY(14px); }
  }
  .logo { font-size: 21px; font-weight: 700; letter-spacing: .38em; }
  .logo span { color: var(--gris); font-weight: 300; }
  .sous { color: var(--gris); font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; margin: 10px 0 34px; }

  label { display: block; font-size: 11px; color: var(--gris); letter-spacing: .12em; text-transform: uppercase; margin: 0 0 7px; }
  input { width: 100%; background: var(--noir3); border: 1px solid var(--bord); border-radius: 10px;
    color: var(--blanc); padding: 13px 14px; font-size: 14px; margin-bottom: 18px;
    transition: border-color 150ms ease; }
  input:focus { outline: none; border-color: #555; }

  button { width: 100%; margin-top: 8px; background: var(--blanc); color: var(--noir); border: 0; border-radius: 999px;
    padding: 14px; font-size: 13px; font-weight: 700; letter-spacing: .1em; cursor: pointer;
    transition: transform 160ms var(--ease-out); }
  button:active { transform: scale(0.97); }

  .note { margin-top: 26px; text-align: center; font-size: 11.5px; color: var(--gris); line-height: 1.7; }
  .note b { color: #c9c4ba; font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .carte { transition: opacity 200ms ease; @starting-style { transform: none; } }
  }
</style>
</head>
<body>
<div class="fond"></div>
<form class="carte" id="formulaire">
  <div class="logo">FKB2B</div>
  <div class="sous">Espace professionnel Footkorner</div>
  <label for="email">E-mail</label>
  <input id="email" type="email" autocomplete="username" placeholder="vous@boutique.fr" required>
  <label for="mdp">Mot de passe</label>
  <input id="mdp" type="password" autocomplete="current-password" placeholder="••••••••" required>
  <button type="submit" id="btn">SE CONNECTER</button>
  <p class="note" id="message">Accès réservé aux clients autorisés.</p>
  <p class="note" style="margin-top:14px">
    <a href="#" id="lien-direct" style="color:var(--gris); text-decoration:underline">Recevoir un lien de connexion</a>
    &nbsp;·&nbsp;
    <a href="#" id="oubli" style="color:var(--gris); text-decoration:underline">Mot de passe oublié ?</a></p>
</form>
<script src="config.js?v=1787668028"></script>
<script>
// Retour d'un lien de connexion (ou d'un lien reçu par e-mail) : la session arrive dans l'adresse.
(function ouvrirDepuisLien() {
  const h = new URLSearchParams(location.hash.slice(1));
  const jeton = h.get("access_token");
  if (!jeton) return;
  // invitation, réinitialisation ou confirmation d'adresse : la personne n'a pas encore
  // de mot de passe à elle, on l'emmène le choisir plutôt que d'ouvrir une session muette.
  if (["recovery", "invite", "signup"].includes(h.get("type"))) {
    location.href = "motdepasse.html" + location.hash;
    return;
  }
  try {
    const charge = JSON.parse(atob(jeton.split(".")[1]));
    localStorage.setItem("fkb2b-session", JSON.stringify({
      access_token: jeton, refresh_token: h.get("refresh_token"),
      expire_a: charge.exp, email: charge.email,
    }));
    location.href = "index.html";
  } catch (e) { /* jeton illisible : on reste sur la page de connexion */ }
})();

if (sessionCourante()) location.href = "index.html";

// Lien de connexion : pratique pour qui ne se connecte que quelques fois par an.
// create_user: false — ce lien ne doit jamais créer de compte, seulement en ouvrir un existant.
document.getElementById("lien-direct").addEventListener("click", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("message");
  const email = document.getElementById("email").value.trim();
  if (!email) {
    msg.innerHTML = "<b>Saisissez d'abord votre e-mail</b>, puis recliquez sur le lien.";
    document.getElementById("email").focus();
    return;
  }
  msg.textContent = "Envoi du lien…";
  try {
    await api("/auth/v1/otp", { corps: {
      email, create_user: false,
      options: { email_redirect_to: location.href.split("#")[0] } } });
  } catch (err) { /* on ne révèle jamais si l'adresse existe */ }
  msg.innerHTML = "<b>Si un compte existe pour cette adresse</b>, un lien de connexion vient d'être envoyé. "
    + "Il est valable une heure.";
});

// Mot de passe oublié : Supabase envoie un lien qui ramène sur motdepasse.html.
document.getElementById("oubli").addEventListener("click", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("message");
  const email = document.getElementById("email").value.trim();
  if (!email) {
    msg.innerHTML = "<b>Saisissez d'abord votre e-mail</b>, puis recliquez sur le lien.";
    document.getElementById("email").focus();
    return;
  }
  msg.textContent = "Envoi du lien…";
  try {
    await api("/auth/v1/recover", { corps: {
      email, redirect_to: location.href.replace(/login\.html.*$/, "motdepasse.html") } });
  } catch (err) { /* on ne dit jamais si l'adresse existe */ }
  msg.innerHTML = "<b>Si un compte existe pour cette adresse</b>, un lien vient d'être envoyé. "
    + "Pensez à regarder dans les indésirables.";
});

document.getElementById("formulaire").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btn"), msg = document.getElementById("message");
  btn.disabled = true; btn.textContent = "CONNEXION…";
  try {
    const r = await api("/auth/v1/token?grant_type=password", {
      corps: { email: document.getElementById("email").value.trim(),
               password: document.getElementById("mdp").value },
    });
    localStorage.setItem("fkb2b-session", JSON.stringify({
      access_token: r.access_token, refresh_token: r.refresh_token,
      expire_a: r.expires_at, email: r.user.email,
    }));
    location.href = "index.html";
  } catch (err) {
    msg.innerHTML = "<b>Identifiants incorrects.</b> Vérifiez votre e-mail et votre mot de passe.";
    btn.disabled = false; btn.textContent = "SE CONNECTER";
  }
});
</script>
</body>
</html>
